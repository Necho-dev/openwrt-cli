# Publish a wheel to PyPI and create a GitHub Release when a version tag is pushed (v1.2.3).
#
# After Unit Test succeeds, and before the wheel is built:
#   1. Tag (without leading v) must match [project].version in pyproject.toml
#   2. That version must not already exist on PyPI
#   3. CHANGELOG.md and CHANGELOG.zh.md must list the same ## [X.Y.Z] versions,
#      each with complete notes for this tag
#
# After a successful PyPI upload, the English notes become the GitHub Release
# body, plus a link to CHANGELOG.zh.md on the same tag.
#
# PyPI auth: Trusted Publishing (OIDC).
#   https://pypi.org/manage/project/openwrt-cli/settings/publishing/
#   Publisher: GitHub, owner Necho-dev, repo openwrt-cli,
#   workflow publish-pypi.yml, environment pypi

name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # Inline tests. Calling unit-test.yml via workflow_call from a tag
  # push dies with startup_failure (no jobs, GitHub generic Error page).
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pip install poetry
      - name: Install
        run: poetry install --with dev
      - name: Unit tests
        env:
          COLUMNS: "80"
          TERMINAL_WIDTH: "80"
          TERM: xterm-256color
        run: poetry run pytest -m "not live"

  publish:
    name: Build wheel and publish
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openwrt-cli/
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Check tag, PyPI, and release notes
        id: preflight
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python .github/scripts/release_preflight.py

      - name: Rewrite README asset URLs for PyPI
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python .github/scripts/readme_pypi_urls.py

      - name: Build wheel
        run: poetry build -f wheel

      - name: Show dist
        run: ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.preflight.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" dist/*.whl \
            --title "openwrt-cli ${version}" \
            --notes-file release-notes.md \
            --verify-tag
